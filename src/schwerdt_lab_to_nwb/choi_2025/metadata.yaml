NWBFile:
  keywords:
    - fast scan cyclic voltammetry
    - dopamine
    - striatum
    - cranial chamber
    - electrophysiology
    - local field potential
  related_publications:
    - https://doi.org/10.1016/j.jneumeth.2025.110467
  experiment_description:
    Chronic neurochemical and electrophysiological recordings from the striatum of a rhesus monkey implanted with an
    aseptic, semi-sealed cranial chamber. Dopamine was measured with fast-scan cyclic voltammetry (FSCV) and spikes and
    local field potentials with a Neuralynx Digital Lynx SX system, while the monkey performed a reward-biased eye
    movement task.
  session_description:
    One session (09/27/2024) of Monkey T performing a reward-biased eye movement task. It contains raw
    electrophysiology (sites c7b, c5c, c5d), bipolar LFP (c7b referenced to c5c), thresholded and Plexon-sorted spikes
    (c5d), raw and trial-aligned FSCV (c8ds), and the trials and task events. Times are in seconds from the session
    start, when the Neuralynx recording was opened.
  institution: University of Pittsburgh
  lab: Schwerdt
  experimenter:
    - Schwerdt, Helen N.
    - Choi, Jiwon
  protocol: https://doi.org/10.17504/protocols.io.kqdg32b91v25/v1, https://doi.org/10.17504/protocols.io.x54v92wd4l3e/v1, https://doi.org/10.17504/protocols.io.bp2l62m95gqe/v1

Subjects:
  Monkey T:
    subject_id: Monkey T
    age: P11Y # 11 years in ISO 8601
    species: Macaca mulatta
    sex: F
    description: Adult female rhesus monkey with a chronic cranial chamber implant over the striatum.

Ecephys:
  Device:
    - name: device_ecephys
      description: Neuralynx recording
  ElectrodeGroup:
    - name: ElectrodeGroup
      description: Electrodes implanted in the striatum, recorded with Neuralynx (Digital Lynx SX).
      location: striatum
      device: device_ecephys
  electrical_series:
    name: electrical_series
    description: The raw acquisition traces from Neuralynx (Digital Lynx SX) acquired with a unity-gain headstage (Neuralynx, HS-36, ±1 mV input range, at 30 or 32 kHz).
  # Added to the descriptions of the units tables
  spike_times_note: "Almost no spikes fall in a window of about 10 ms in each 100 ms FSCV cycle, around the scan artifact. Whether spikes there were removed or not detected is not documented."
  lfp_series:
    name: bipolar_lfp_series
    description: "Bipolar LFP at 1 kHz, in volts. The source data are 60 s windows around each trial, joined here into one series, with each time stored once. The preprocessing (filters, line-noise removal) is not documented."

# Contains metadata for the raw FSCV data (measured current and applied voltages, sampled at 25kHz)
FSCV:
    Device:
      name: device_ecephys
      description: Neuralynx recording
    ElectrodeGroup:
      name: FSCVElectrodeGroup
      description: The electrode group for the FSCV electrodes.
      location: striatum
      device: device_ecephys
    FSCVResponseSeries:
      name: fscv_response_series
      description: "FSCV response current before background subtraction. Scan times are mapped to the session clock from the scan times in the trial list, to within about one scan (0.1 s)."
      unit: amperes
    FSCVExcitationSeries:
      name: fscv_excitation_series
      description: "FSCV excitation series for applied voltage waveform. Scan times are mapped to the session clock from the scan times in the trial list, to within about one scan (0.1 s)."
      unit: volts
      scan_frequency: 10.0 # in Hz
      sweep_rate: 400.0 # in V/s
      waveform_shape: Triangle

Events:
  AnnotatedEventsTable:
    name: events_table
    description: "Task events from the 8-bit Neuralynx event codes, named by the event map of the trial list. Each event is stored once, in time order. Codes missing from the event map are named 'TTL code <code>'. The meaning of the reward condition codes is inferred from the reward events of the session."
  # Added to the description of the event with this code
  event_descriptions:
    40: "Reward condition of the trial: every rewarded trial with this code got the small reward (code 100)."
    41: "Reward condition of the trial: every rewarded trial with this code got the big reward (code 101)."

# Contains metadata for trial-aligned FSCV data
TrialAlignedFSCV:
  table:
    name: trial_aligned_fscv_table
    description: "Trial-aligned FSCV analysis: PCA-extracted dopamine, pH and motion components and the oxidation current. Each series has 601 samples at 10 Hz, from 30 s before to 30 s after the trial midpoint. The units and the reference window of the components are not given in the source data."
  columns:
    - name: good
      description: "Quality flag of the trial, from the source data."
    - name: da
      description: "PCA-extracted dopamine component. Units unknown. Some samples are NaN in the source data; the reason is not documented."
    - name: ph
      description: "PCA-extracted pH component. Units unknown."
    - name: m
      description: "PCA-extracted motion artifact component. Units unknown."
    - name: iox
      description: "Oxidation current at about 0.6 V, where dopamine oxidizes. Units unknown."

Behavior:
    EyeTracking:
      Device:
        name: device_ecephys
        description: Neuralynx recording
      SpatialSeries:
        name: eye_tracking_series
        description: "Uncalibrated eye position signal (x, y) in volts, recorded with Neuralynx (Digital Lynx SX). x is channel CSC146 and y is channel CSC145, as in the session notes; the channel list of the trial list names them the other way round."
        unit: volts
