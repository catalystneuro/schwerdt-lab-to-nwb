NWBFile:
  keywords:
    - fast scan cyclic voltammetry
    - micro-invasive neural implant
    - dopamine
    - striatum
  related_publications:
    - https://doi.org/10.1021/acschemneuro.5c00071
    - https://doi.org/10.1101/2025.01.30.635139
  experiment_description:
    This experiment contains in vivo recordings of reward- and movement-related dopamine, spikes, and local field potentials
    obtained using single- and dual-channel shaft-assisted micro-invasive probes (s-µIPs) chronically implanted in the striatum
    of task-performing rhesus monkeys. The s-µIPs leverage carbon fiber materials to enable dual neurochemical and electrical
    neural activity recording at micro-invasive (10 µm) spatial footprints near the recording sites, while a wider shaft provides
    rigidity for deep brain targeting using standard cranial chambers. These probes allow for measurements from deep brain targets
    with minimal tissue disruption at the recording site. Recordings were made during performance of reward-biased eye movement
    tasks, enabling simultaneous measurement of dopamine transients, spikes, and local field potentials with micrometer spatial
    resolution. Chronic implants demonstrated stable, multi-modal neural activity measurements from micro-invasive devices over
    extended periods post-implantation.
  session_description:
    In vivo recordings of dopamine, spikes and local field potentials from micro-invasive probes (s-µIPs) chronically
    implanted in the striatum of rhesus monkeys performing reward-biased eye movement tasks. Times are in seconds from
    the session start. In the 2024 sessions this is when the Neuralynx recording was opened. In the 2018 session
    (Monkey P) times follow the Neuralynx acquisition clock, which counts from the start of the acquisition software, at least 49 s before the session start time (when the
    recording file was created).
  institution: University of Pittsburgh
  lab: Schwerdt
  experimenter:
    - Schwerdt, Helen N.
    - Amjad, Usamma
  protocol: https://doi.org/10.17504/protocols.io.kqdg32b91v25/v1, https://doi.org/10.17504/protocols.io.x54v92wd4l3e/v1, https://doi.org/10.17504/protocols.io.bp2l62m95gqe/v1

Subjects:
  Monkey T:
    subject_id: Monkey T
    age: P11Y # 11 years in ISO 8601
    species: Macaca mulatta
    sex: F
    description: Adult female rhesus monkey with chronic s-µIP implants in the striatum.
  Monkey P:
    subject_id: Monkey P
    age: P8Y # 8 years in ISO 8601
    species: Macaca mulatta
    sex: F
    description: Adult female rhesus monkey with chronic s-µIP implants in the striatum.

Ecephys:
  Device:
    - name: device_ecephys
      description: Neuralynx recording
  ElectrodeGroup:
    - name: ElectrodeGroup
      description: Electrodes implanted in the striatum, recorded with Neuralynx (Digital Lynx SX).
      location: striatum
      device: device_ecephys
  electrical_series:
    name: electrical_series
    description: Raw Neuralynx (Digital Lynx SX) traces acquired at 30 kHz (Monkey P) or 32 kHz (Monkey T) with a unity-gain headstage (HS-36, ±1 mV input range).
  lfp_series:
    name: bipolar_lfp_series
    description: "Bipolar LFP at 1 kHz, in volts. The source data are 60 s windows around each trial, joined here into one series with NaN in the gaps. The signal is broadband, with narrow spectral dips at multiples of 10 Hz. The preprocessing (filters, line-noise removal) is not documented."

# Contains metadata for the raw FSCV data (measured current and applied voltages, sampled at 25kHz)
FSCV:
    Device:
      name: device_ecephys
      description: Neuralynx recording
    ElectrodeGroup:
      name: FSCVElectrodeGroup
      description: The electrode group for the FSCV electrodes.
      location: striatum
      device: device_ecephys
    FSCVResponseSeries:
      name: fscv_response_series
      description: FSCV response current before background subtraction.
      unit: amperes
    FSCVExcitationSeries:
      name: fscv_excitation_series
      description: FSCV excitation series for applied voltage waveform.
      unit: volts
      scan_frequency: 10.0 # in Hz
      sweep_rate: 400.0 # in V/s
      waveform_shape: Triangle

Events:
  AnnotatedEventsTable:
    name: events_table
    description: "Task events from the 8-bit Neuralynx event codes, named by the event map of the trial list. Each event is stored once, in time order. Codes missing from the event map are named 'TTL code <code>'. The meaning of the reward condition codes is inferred from the reward events of the session."
  # Added to the description of the event with this code
  event_descriptions:
    30: "Choice trials: the left cue is the big-reward cue (code 101 after choosing it)."
    31: "Choice trials: the left cue is the cue without the big reward (no code 101 after choosing it)."
    35: "The right cue in choice trials, or the single cue on either side in forced trials (side given by codes 117 and 118), is the big-reward cue (code 101)."
    36: "The right cue in choice trials, or the single cue on either side in forced trials (side given by codes 117 and 118), is the cue without the big reward (no code 101)."
    40: "Reward condition of the trial: every rewarded trial with this code got the small reward (code 100)."
    41: "Reward condition of the trial: every rewarded trial with this code got the big reward (code 101)."

# Contains metadata for trial-aligned FSCV data
TrialAlignedFSCV:
  table:
    name: trial_aligned_fscv_table
    description: "Trial-aligned FSCV analysis: PCA-extracted dopamine, pH and motion components and the oxidation current. Each series has 601 samples at 10 Hz, from 30 s before to 30 s after the trial midpoint. The units and the reference window of the components are not given in the source data."
  columns:
    - name: good
      description: "Quality flag of the trial, from the source data."
    - name: da
      description: "PCA-extracted dopamine component. Units unknown. Some samples are NaN in the source data; the reason is not documented."
    - name: ph
      description: "PCA-extracted pH component. Units unknown."
    - name: m
      description: "PCA-extracted motion artifact component. Units unknown."
    - name: iox
      description: "Oxidation current at about 0.6 V, where dopamine oxidizes. Units unknown."

Behavior:
    EyeTracking:
      Device:
        name: device_ecephys
        description: Neuralynx recording
      SpatialSeries:
        name: eye_tracking_series
        description: "Uncalibrated eye position signal (x, y) in volts, recorded with Neuralynx (Digital Lynx SX). x is channel CSC146 and y is channel CSC145, as in the session notes; the channel list of the trial list names them the other way round."
        unit: volts
